8A%A4%EB%8B%98-%ED%81%AC%EB%A6%AC%EC%8A%A4%EB%A7%88%EC%8A%A4/%ED%94%8C%EB%9E%91%202%ED%98%B8%EC%A0%90/7.jpg","name":"7.jpg","width":624,"height":401}]}];
  const stage = document.getElementById('csg-stage');
  const tabBar = document.getElementById('csg-tabs');
  const tabScroll = document.getElementById('csg-tab-scroll');
  const indicator = document.getElementById('csg-indicator');
  const tabs = [];
  let current = 0;
  let panel = null;
  let finalizeAnimation = null;
  const pad = n => String(n).padStart(2,'0');

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  // 설명 속 <br>, <br/>, <br />만 실제 줄바꿈으로 처리합니다.
  function appendTextWithBreaks(container, value) {
    const pieces = value.split(/<br\s*\/?>/gi);
    pieces.forEach((piece, index) => {
      if (index > 0) container.appendChild(document.createElement('br'));
      if (piece) container.appendChild(document.createTextNode(piece));
    });
  }
  // 설명에서는 웹 링크(a href)와 줄바꿈(br)만 처리하고, 나머지 HTML은 텍스트로 표시합니다.
  function appendDescription(container, value) {
    const anchorPattern = /<a\s+href\s*=\s*(["'])(.*?)\1\s*>([\s\S]*?)<\/a>/gi;
    let lastIndex = 0;
    for (const match of value.matchAll(anchorPattern)) {
      appendTextWithBreaks(container, value.slice(lastIndex, match.index));
      try {
        const url = new URL(match[2], document.baseURI);
        if (url.protocol !== 'https:' && url.protocol !== 'http:') throw new Error('Unsupported URL');
        const link = document.createElement('a');
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        appendTextWithBreaks(link, match[3]);
        container.appendChild(link);
      } catch (_) {
        appendTextWithBreaks(container, match[0]);
      }
      lastIndex = match.index + match[0].length;
    }
    appendTextWithBreaks(container, value.slice(lastIndex));
  }

  // Jekyll의 /페이지이름/ 주소에서도 img/ 사진을 찾습니다.
  // HTML 직접 열기(파일명.html), GitHub Pages 하위 경로에서도 동작하도록
  // 상대 경로 후보를 순서대로 확인합니다.
  function imageUrlCandidates(src) {
    const prefixes = location.pathname.endsWith('/')
      ? ['../', '', '../../', '../../../', '../../../../']
      : ['', '../', '../../', '../../../', '../../../../'];
    return [...new Set(prefixes.map(prefix => new URL(prefix + src, document.baseURI).href))];
  }

  function buildPanel(index) {
    const item = sections[index];
    const root = el('section', 'gallery-panel');
    root.id = 'csg-panel-' + index;
    root.setAttribute('role','tabpanel');
    root.setAttribute('aria-labelledby','csg-tab-' + index);

    const header = el('div', 'section-head');
    header.appendChild(el('div','section-kicker','LOCATION  ' + pad(index+1) + ' / ' + pad(sections.length)));
    const titleRow = el('div','section-title-row');
    titleRow.append(el('h2','',item.name), el('span','count',item.photos.length + '장'));
    header.append(titleRow, el('div','section-divider'));
    root.appendChild(header);
    if (item.description && item.description.trim()) {
      const description = el('div','studio-description');
      appendDescription(description, item.description);
      root.appendChild(description);
    }

    if (!item.photos.length) {
      const empty = el('div','empty');
      empty.append(el('div','empty-title','아직 등록된 사진이 없습니다'),
                   el('div','empty-info','이 폴더에 사진을 넣고 Python을 다시 실행하세요.'),
                   el('div','empty-path',item.folder));
      root.appendChild(empty);
    } else {
      const list = el('div','photo-list');
      item.photos.forEach((photo, i) => {
        const figure = el('figure','photo');
        const image = document.createElement('img');
        image.alt = item.name + ' · ' + photo.name;
        if (photo.width && photo.height) {
          // 스크롤하기 전에도 세로로 긴 사진의 공간을 정확하게 확보합니다.
          image.width = photo.width;
          image.height = photo.height;
        }
        image.loading = i < 2 ? 'eager' : 'lazy';
        image.decoding = 'async';
        if (i === 0) image.fetchPriority = 'high';
        // 예: /페이지이름/ 에서 상대 img/ 주소는 잘못된 폴더를 가리킬 수 있습니다.
        // 먼저 한 단계 위의 img/ 경로를 사용하고, 없으면 다른 배포 경로를 확인합니다.
        const candidates = imageUrlCandidates(photo.src);
        let attempt = 0;
        image.addEventListener('error', () => {
          attempt += 1;
          if (attempt < candidates.length) image.src = candidates[attempt];
          else figure.classList.add('broken');
        });
        image.src = candidates[0];
        figure.appendChild(image);
        list.appendChild(figure);
      });
      root.appendChild(list);
    }
    return root;
  }

  function positionIndicator(index, animated = true) {
    const tab = tabs[index];
    if (!tab) return;
    if (!animated) indicator.style.transition = 'none';
    indicator.style.width = tab.offsetWidth + 'px';
    indicator.style.transform = 'translate3d(' + tab.offsetLeft + 'px,0,0)';
    if (!animated) requestAnimationFrame(() => {indicator.style.transition='';});
    tabScroll.scrollTo({left:tab.offsetLeft+tab.offsetWidth/2-tabScroll.clientWidth/2,
                        behavior:animated ? 'smooth' : 'instant'});
  }
  function switchSection(next, animate = true) {
    if (next < 0 || next >= sections.length || next === current) return;
    if (finalizeAnimation) finalizeAnimation();
    const dir = next > current ? 1 : -1;
    const oldPanel = panel;
    current = next;
    tabs.forEach((tab,i) => {
      tab.setAttribute('aria-selected',String(i===current));
      tab.tabIndex = (i===current) ? 0 : -1;
    });
    positionIndicator(current);
    const nextPanel = buildPanel(current);
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!oldPanel || !animate || reduced) {
      stage.replaceChildren(nextPanel); panel = nextPanel; stage.style.height='auto';
    } else {
      stage.style.height = oldPanel.getBoundingClientRect().height + 'px';
      oldPanel.style.position='absolute';
      oldPanel.style.inset='0 0 auto';
      oldPanel.style.pointerEvents='none';
      nextPanel.classList.add(dir>0?'from-right':'from-left');
      stage.appendChild(nextPanel);
      panel=nextPanel;
      const nextHeight=nextPanel.scrollHeight;
      let done=false;
      let timeout;
      const cleanup=() => {
        if (done) return;
        done=true;
        clearTimeout(timeout);
        oldPanel.remove();
        nextPanel.classList.remove('from-right','from-left');
        stage.style.height='auto';
        if (finalizeAnimation===cleanup) finalizeAnimation=null;
      };
      finalizeAnimation=cleanup;
      nextPanel.getBoundingClientRect();
      requestAnimationFrame(() => {
        if (done) return;
        stage.style.height=nextHeight+'px';
        nextPanel.classList.remove('from-right','from-left');
        oldPanel.classList.add(dir>0?'out-left':'out-right');
      });
      timeout=setTimeout(cleanup,570);
    }
    // 긴 사진을 아래쪽까지 읽다가 다른 탭으로 바꾼 경우 사진 첫머리로 복귀.
    const shell=document.querySelector('.tabs-shell');
    const shellTop=shell.getBoundingClientRect().top+window.scrollY;
    if (window.scrollY > shellTop + shell.offsetHeight + 100) {
      window.scrollTo({top:Math.max(0,shellTop),behavior:'smooth'});
    }
  }
  sections.forEach((item,index) => {
    const tab = el('button','tab',item.name);
    tab.type='button';
    tab.id='csg-tab-'+index;
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-controls','csg-panel-'+index);
    tab.setAttribute('aria-selected',String(index===0));
    tab.tabIndex=index===0?0:-1;
    tab.addEventListener('click',() => switchSection(index));
    tab.addEventListener('keydown',event => {
      let next=index;
      if (event.key==='ArrowRight') next=(index+1)%sections.length;
      else if (event.key==='ArrowLeft') next=(index-1+sections.length)%sections.length;
      else if (event.key==='Home') next=0;
      else if (event.key==='End') next=sections.length-1;
      else return;
      event.preventDefault();
      switchSection(next);
      tabs[next].focus();
    });
    tabBar.appendChild(tab);
    tabs.push(tab);
  });
  panel = buildPanel(0);
  stage.appendChild(panel);
  requestAnimationFrame(() => positionIndicator(0,false));
  window.addEventListener('resize',() => positionIndicator(current,false),{passive:true});
})();
</script>
</body>
</html>
