---
layout: default

<style>
  /* =========================
     HUB PAGE
     ========================= */

  .hub-page {
    --hub-text: #222;
    --hub-subtext: rgba(30, 30, 30, 0.58);
    --hub-card: rgba(255, 255, 255, 0.90);

    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    padding: 36px 18px 70px;

    color: var(--hub-text);
  }

  /* 프로필 */

  .hub-profile {
    text-align: center;
    margin-bottom: 34px;
  }

  .hub-profile-image {
    width: 108px;
    height: 108px;

    margin: 0 auto 17px;

    border-radius: 50%;

    background-image: url("{{ '/img/ginza0817.jpg' | relative_url }}");

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    border: 3px solid var(--main);

    box-shadow:
      0 5px 22px var(--sub);
  }

  .hub-name {
    margin: 0;

    color: var(--main);
    font-size: 25px;
    font-weight: 800;
    line-height: 1.3;
    letter-spacing: -0.7px;
  }

  .hub-bio {
    margin: 9px 0 0;

    color: var(--main);
    font-size: 14px;
    font-weight: 400;
    line-height: 1.65;
  }


  /* =========================
     LINKS
     ========================= */

  .hub-links {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .hub-link {
    display: flex;
    align-items: center;

    width: 100%;
    min-height: 74px;

    padding: 14px 18px;

    color: var(--hub-text);
    text-decoration: none !important;

    background: var(--hub-card);

    border: 1px solid rgba(0, 0, 0, 0.045);
    border-radius: 18px;

    box-shadow:
      0 4px 18px rgba(0, 0, 0, 0.095);

    transition:
      transform 0.16s ease,
      box-shadow 0.16s ease,
      background 0.16s ease;
  }

  .hub-link:hover {
    color: var(--hub-text);
    text-decoration: none;

    transform: translateY(-2px);

    background: #fff;

    box-shadow:
      0 8px 25px rgba(0, 0, 0, 0.09);
  }

  .hub-link:active {
    transform: scale(0.985);
  }


  /* 아이콘 */

  .hub-icon {
    display: flex;
    align-items: center;
    justify-content: center;

    flex: 0 0 44px;

    width: 44px;
    height: 44px;

    margin-right: 15px;

    border-radius: 13px;

    background: rgba(0, 0, 0, 0.055);

    font-size: 20px;
    line-height: 1;
  }


  /* 텍스트 */

  .hub-link-content {
    flex: 1;
    min-width: 0;
  }

  .hub-link-title {
    font-size: 16px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.35px;
  }

  .hub-link-desc {
    margin-top: 4px;

    font-size: 12px;
    font-weight: 400;
    line-height: 1.4;

    color: rgba(30, 30, 30, 0.48);
  }


  /* 화살표 */

  .hub-arrow {
    flex-shrink: 0;

    margin-left: 12px;

    color: rgba(0, 0, 0, 0.28);

    font-size: 23px;
    font-weight: 300;
    line-height: 1;
  }


  /* =========================
     MOBILE
     ========================= */

  @media (max-width: 600px) {

    .hub-page {
      padding:
        28px 14px 55px;
    }

    .hub-profile {
      margin-bottom: 29px;
    }

    .hub-profile-image {
      width: 96px;
      height: 96px;

      margin-bottom: 15px;
    }

    .hub-name {
      font-size: 23px;
    }

    .hub-bio {
      font-size: 13px;
    }

    .hub-link {
      min-height: 70px;

      padding:
        13px 16px;

      border-radius: 17px;
    }

    .hub-icon {
      width: 42px;
      height: 42px;

      flex-basis: 42px;

      margin-right: 13px;
    }

  }
</style>
