<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>

<script>
// @license magnet:?xt=urn:btih:d3d9a9a6595521f9666a5e94cc830dab83b65699&dn=expat.txt Expat
    const themePreference = () => {
        const hasLocalStorage = localStorage.getItem('theme');
        let supports = false;
        let theme = undefined;

        if (hasLocalStorage === 'light') {
            theme = 'light';
        }
        if (hasLocalStorage === 'dark') {
            theme = 'dark';
        }

        if (window.matchMedia(`(prefers_color: dark)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'dark';
            supports = true;
        };
        if (window.matchMedia(`(prefers_color: light)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'light';
            supports = true;
        };
        if (window.matchMedia(`(prefers_color: no-preference)`).matches) {
            theme = hasLocalStorage ? hasLocalStorage : 'none';
            supports = true;
        };

        return {
            supports,
            theme
        };
    }

    document.addEventListener('DOMContentLoaded', e => {
        console.clear();

        const userThemePreference = themePreference();
        const toggle = document.querySelector('[theme_toggle]');
        const html = document.documentElement;

        const setTheme = () => {
            switch (userThemePreference.theme) {
                case 'dark':
                    toggle.checked = false;
                    document.body.classList.add('dark');
                    document.body.classList.remove('light');
                    break;
                case 'light':
                    toggle.checked = true;
                    document.body.classList.add('light');
                    document.body.classList.remove('dark');
                    break;
            }
        }
        setTheme();
        toggle.addEventListener('click', e => {
            if (toggle.checked) {
                document.body.classList.add('light');
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.add('dark');
                document.body.classList.remove('light');
                localStorage.setItem('theme', 'dark');
            }
        }, false);
        document.body.style.visibility = 'visible';
    }, false);
// @license-end
</script>

{% if page.layout == "post" %}
<script>
document.addEventListener('DOMContentLoaded', function () {
  // 모든 .pre 블록 순회
  document.querySelectorAll('.pre').forEach(function(pre) {
    // 이미 '게시물 더보기' 링크가 있으면 스킵
    if (pre.querySelector('a[data-more-link="true"]')) return;

    // 닉네임 추출: 첫 번째 <p>의 텍스트에서 '(' 이전까지
    const firstP = pre.querySelector('p');
    if (!firstP) return;

    const raw = (firstP.textContent || '').trim();
    if (!raw) return;

    // '말차당고(@MalchaDango_cos)' → '말차당고'
    const nickname = raw.split('(@')[0].trim();
    if (!nickname) return;

    // 링크 요소 생성 (/models/닉네임) — 한글 안전하게 인코딩
    const moreP = document.createElement('p');
    const a = document.createElement('a');
    a.href = "/models/" + encodeURIComponent(nickname);
    a.textContent = nickname + " 님 게시물 더보기";
    a.setAttribute('data-more-link', 'true');

    moreP.appendChild(a);
    pre.appendChild(moreP);
  });
});
</script>
{% endif %}


{% if page.layout == "post" %}
<script>
document.addEventListener('DOMContentLoaded', function() {
  // 토스트 노드 생성 및 추가
  const toast = document.createElement('div');
  toast.id = 'copy-toast';
  toast.textContent = '주소가 복사되었습니다';
  document.body.appendChild(toast);

  // 클릭 대상을 .post-title로 지정 (or post-header h1 등)
  const title = document.querySelector('.post-title');
  if (title) {
    title.style.cursor = 'pointer';
    title.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 1000); // 1초 후 사라짐
      } catch (e) {
        console.error('클립보드 복사 실패:', e);
      }
    });
  }
});
</script>
{% endif %}
