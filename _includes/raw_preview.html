{% for post in include.posts %}
    {% cycle 'add-row' : '<div class="row">', '' %}
        <div class="column column-50">
            <div class="preview-panel">
                <a href="{{ post.url | prepend: site.baseurl }}">
                    <img src="{{ post.preview }}">
                </a>
                <div class="post-title">{{ post.title }}</div>
            </div>
        </div>
    {% cycle 'end-row' : '', '</div>' %}
{% endfor %}
{% cycle 'end-row' : '', '</div>' %}
